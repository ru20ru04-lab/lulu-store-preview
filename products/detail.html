<script>
/* モバイル：写真エリアを過ぎたら右下に「写真 N」FABを表示。
   写真自体は sticky にせず、通常フローで自然にスクロールで消える（動きゼロ）。 */
(function () {
  const mql = window.matchMedia('(max-width: 899px)');
  const slot = document.getElementById('photo-slot');

  function setupFab(images) {
    if (!images || images.length < 2) return; // 1枚しかない時はFAB不要
    const fab = document.createElement('button');
    fab.type = 'button';
    fab.className = 'detail-photo-fab';
    fab.setAttribute('aria-label', '写真 ' + images.length + ' 枚を一覧表示');
    fab.innerHTML =
      '<svg viewBox="0 0 24 24" aria-hidden="true">' +
        '<rect x="3" y="5.5" width="18" height="13" rx="1.5"/>' +
        '<circle cx="9" cy="10.5" r="1.5"/>' +
        '<path d="M3.5 17 L9 12 L14 16 L20.5 10.5"/>' +
      '</svg>' +
      '<span>写真 ' + images.length + '</span>';
    document.body.appendChild(fab);

    fab.addEventListener('click', function () {
      if (window.LuLuPhotoGrid) window.LuLuPhotoGrid.open();
    });

    function update() {
      // PC は非表示（PCは横並び固定情報カラムがある）
      if (!mql.matches) {
        fab.classList.remove('detail-photo-fab--visible');
        return;
      }
      // 写真スロットが画面から完全に上に抜けたら表示
      const rect = slot.getBoundingClientRect();
      const gone = rect.bottom < 40;
      fab.classList.toggle('detail-photo-fab--visible', gone);
    }
    let raf = 0;
    window.addEventListener('scroll', function () {
      if (!raf) raf = requestAnimationFrame(function () { raf = 0; update(); });
    }, { passive: true });
    window.addEventListener('resize', update);
    update();
  }

  LuLuDetail.init({ onReady: function (p, images) { setupFab(images); } });
})();
</script>
